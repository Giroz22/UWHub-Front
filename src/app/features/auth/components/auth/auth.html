<main class="auth-container">
  <div class="auth-form">
    <div class="auth-body">
      @if (isRegister) {
      <app-form-login></app-form-login>
      }@else {
      <app-form-register></app-form-register>
      }
    </div>

    <div class="auth-footer">
      @if(isRegister){ ¿No tienes una cuenta? } @else { ¿Ya tienes una cuenta? }
      <a (click)="isRegister = !isRegister">
        {{ isRegister ? "Registrate" : "Inicia sesión" }}
      </a>
    </div>
  </div>
</main>
